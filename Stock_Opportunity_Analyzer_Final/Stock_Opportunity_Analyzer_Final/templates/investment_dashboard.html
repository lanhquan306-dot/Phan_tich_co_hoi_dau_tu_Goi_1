<!doctype html>
<html lang="vi" data-theme="dark">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stock Opportunity Analyzer</title>
<style>
:root{--bg:#08101f;--panel:#101a2d;--panel2:#142038;--panel3:#0c1527;--line:#263653;--text:#eef4ff;--muted:#93a3bd;--accent:#5b8cff;--green:#2fd19b;--red:#ff667a;--yellow:#ffcb66;--shadow:0 16px 44px rgba(0,0,0,.28)}
[data-theme="light"]{--bg:#f4f7fb;--panel:#fff;--panel2:#f8faff;--panel3:#eef3fb;--line:#d8e0ed;--text:#162033;--muted:#61718a;--shadow:0 12px 30px rgba(20,45,80,.12)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif}.shell{max-width:1440px;margin:auto;padding:18px 22px 44px}.topbar{position:sticky;top:0;z-index:15;display:flex;align-items:center;gap:14px;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);padding:12px 0}.brand{font-weight:900;letter-spacing:-.4px}.brand span{color:var(--accent)}.search{display:flex;gap:8px;max-width:480px;flex:1}.search input{width:100%;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:11px 13px;text-transform:uppercase}.btn{border:1px solid var(--line);background:var(--panel);color:var(--text);padding:10px 14px;border-radius:10px;font-weight:800;cursor:pointer}.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}.btn.small{padding:7px 10px;font-size:12px}.spacer{flex:1}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}.hero{display:grid;grid-template-columns:minmax(0,1fr) 390px;gap:14px;margin-top:6px}.hero-main,.score-card,.section{padding:20px}.ticker{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.ticker h1{font-size:34px;margin:0}.company{color:var(--muted)}.pill{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;padding:5px 9px;color:var(--muted);font-size:12px;background:var(--panel2)}.price{font-size:30px;font-weight:900;margin-top:16px}.muted{color:var(--muted)}.tiny{font-size:12px}.assessment{line-height:1.55;margin:14px 0 0}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.actions a{text-decoration:none}.signal{font-size:24px;font-weight:950;margin:5px 0}.signal.buy,.up{color:var(--green)}.signal.sell,.down{color:var(--red)}.signal.hold,.warn{color:var(--yellow)}.score-num{font-size:50px;font-weight:950;line-height:1;margin:8px 0}.score-pair{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.mini-score{padding:12px;background:var(--panel2);border:1px solid var(--line);border-radius:12px}.mini-score strong{font-size:23px}.bar{height:7px;background:var(--panel3);border-radius:99px;overflow:hidden;margin-top:7px}.bar i{display:block;height:100%;background:var(--accent)}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px;margin-top:14px}.span12{grid-column:span 12}.span8{grid-column:span 8}.span6{grid-column:span 6}.span4{grid-column:span 4}.section h2{font-size:17px;margin:0 0 14px}.section h3{font-size:14px;margin:18px 0 10px}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.metric{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px}.metric small{display:block;color:var(--muted);min-height:34px}.metric strong{display:block;font-size:19px;margin-top:4px}.metric .pts{font-size:11px;color:var(--muted);margin-top:5px}.comment{background:var(--panel3);border-left:3px solid var(--accent);padding:10px 12px;border-radius:8px;margin:8px 0;color:var(--muted);line-height:1.5}.chart-wrap{height:650px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#131722}.chart-wrap iframe{width:100%;height:100%;border:0}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:760px}.table th,.table td{text-align:left;border-bottom:1px solid var(--line);padding:10px 8px;vertical-align:top}.table th{color:var(--muted);font-size:12px}.table td{font-size:13px;line-height:1.45}.lists{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.listbox{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:14px}.listbox h3{margin:0 0 9px;font-size:13px}.listbox ul{margin:0;padding-left:18px;color:var(--muted)}.listbox li{margin:6px 0;line-height:1.45}.rule-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.rule{padding:12px;background:var(--panel2);border:1px solid var(--line);border-radius:12px}.rule b{display:block;margin-bottom:5px}.method-list{margin:0;padding-left:18px;color:var(--muted);line-height:1.55}.notice{border:1px solid color-mix(in srgb,var(--yellow) 50%,var(--line));background:color-mix(in srgb,var(--yellow) 8%,var(--panel));padding:12px;border-radius:12px;color:var(--muted)}.backtest-box{min-height:110px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:13px}.bt-metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.bt-metrics>div{padding:10px;background:var(--panel3);border-radius:9px}.bt-metrics b{display:block;font-size:18px}.empty{padding:90px 20px;text-align:center;color:var(--muted)}.foot{margin-top:18px;color:var(--muted);font-size:12px;text-align:center}.chat-toggle{position:fixed;right:22px;bottom:22px;width:52px;height:52px;border:0;border-radius:50%;background:var(--accent);color:#fff;cursor:pointer;font-weight:900;box-shadow:var(--shadow);z-index:30}.chat{position:fixed;right:22px;top:86px;bottom:84px;width:380px;background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);z-index:29;display:none;flex-direction:column;overflow:hidden}.chat.open{display:flex}.chat-head{padding:14px 15px;border-bottom:1px solid var(--line);font-weight:900}.chat-body{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:9px}.msg{max-width:92%;padding:9px 11px;border-radius:12px;white-space:pre-wrap;line-height:1.45}.msg.bot{background:var(--panel2);align-self:flex-start}.msg.user{background:var(--accent);color:#fff;align-self:flex-end}.chat-form{display:flex;gap:7px;padding:10px;border-top:1px solid var(--line)}.chat-form input{flex:1;min-width:0;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:9px;padding:9px}.section-nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.section-nav a{color:var(--muted);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:6px 10px;font-size:12px}.profile-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.profile-item{padding:12px;background:var(--panel2);border:1px solid var(--line);border-radius:11px}.profile-item small{display:block;color:var(--muted);margin-bottom:5px}.news-item{padding:12px 0;border-bottom:1px solid var(--line)}.news-item:last-child{border-bottom:0}.news-title{font-weight:800;line-height:1.4}.news-meta{font-size:11px;color:var(--muted);margin-top:4px}.news-item a{color:var(--accent);text-decoration:none}.status-ok{color:var(--green)}.status-error{color:var(--red)}
@media(max-width:1050px){.hero{grid-template-columns:1fr}.span8,.span6,.span4{grid-column:span 12}.metrics{grid-template-columns:repeat(2,1fr)}.lists,.rule-grid{grid-template-columns:1fr}.profile-grid{grid-template-columns:repeat(2,1fr)}.bt-metrics{grid-template-columns:repeat(2,1fr)}.chart-wrap{height:560px}}@media(max-width:640px){.shell{padding:10px}.topbar{flex-wrap:wrap}.brand{width:100%}.search{order:3;max-width:none;width:100%}.metrics,.profile-grid{grid-template-columns:1fr}.score-pair{grid-template-columns:1fr 1fr}.chat{right:8px;left:8px;width:auto;top:72px}.chart-wrap{height:480px}.hero-main,.score-card,.section{padding:14px}.bt-metrics{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="shell"><div class="topbar"><div class="brand">Stock <span>Opportunity</span> Analyzer</div><div class="search"><input id="symbolInput" placeholder="Nhập mã, VD: FPT, MWG, VCB" maxlength="10"><button class="btn primary" id="analyzeBtn">Phân tích</button></div><div class="spacer"></div><button class="btn" id="themeBtn">Giao diện</button></div><main id="app"></main><div class="foot">Công cụ hỗ trợ phân tích học thuật/tham khảo. Không bảo đảm lợi nhuận và không thay thế quyết định đầu tư của người dùng.</div></div>
<button class="chat-toggle" id="chatToggle" title="Mở chatbot">AI</button><aside class="chat" id="chatPanel"><div class="chat-head">Trợ lý phân tích <span id="chatTicker"></span></div><div class="chat-body" id="chatBody"><div class="msg bot">Bạn có thể hỏi vì sao tín hiệu là BUY/HOLD/SELL, chỉ số nào kéo điểm xuống, RSI có ý nghĩa gì hoặc rủi ro chính của mã đang xem.</div></div><div class="chat-form"><input id="chatInput" placeholder="Nhập câu hỏi..."><button class="btn primary" id="chatSend">Gửi</button></div></aside>
<script>
const D=__ANALYSIS_JSON__;const $=id=>document.getElementById(id);const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));const num=v=>v===null||v===undefined||!isFinite(Number(v))?null:Number(v);const money=v=>num(v)===null?"—":Math.round(Number(v)).toLocaleString("vi-VN");const val=(v,u)=>{v=num(v);if(v===null)return"—";if(u==="%")return(v>0?"+":"")+v.toFixed(1)+"%";if(u==="x")return v.toFixed(2)+"x";return money(v)};const tone=v=>num(v)===null?"":v>0?"up":v<0?"down":"";const scoreTone=s=>num(s)>=70?"up":num(s)<40?"down":"warn";const signalClass=s=>s==="BUY"?"buy":s==="SELL"?"sell":s==="HOLD"?"hold":"";
function go(){const s=$("symbolInput").value.trim().toUpperCase().replace(/[^A-Z0-9]/g,"");if(s)location.href="/analysis/"+s}$("analyzeBtn").onclick=go;$("symbolInput").addEventListener("keydown",e=>{if(e.key==="Enter")go()});let theme=localStorage.getItem("investment-theme")||"dark";document.documentElement.dataset.theme=theme;$("themeBtn").onclick=()=>{theme=theme==="dark"?"light":"dark";document.documentElement.dataset.theme=theme;localStorage.setItem("investment-theme",theme)};
function list(title,arr,klass=""){return `<div class="listbox"><h3 class="${klass}">${title}</h3><ul>${(arr&&arr.length?arr:["Chưa có mục nổi bật từ dữ liệu hiện có."]).map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>`}function comments(items){return(items||[]).map(x=>`<div class="comment">${esc(x)}</div>`).join("")||'<div class="muted tiny">Chưa đủ dữ liệu để tạo nhận xét tự động.</div>'}function groupMetrics(keys,c){return keys.map(k=>{const x=c[k];if(!x)return"";return `<div class="metric"><small>${esc(x.name)}</small><strong class="${tone(x.value)}">${val(x.value,x.unit)}</strong><div class="pts">Điểm ${x.points===null?"N/A":Number(x.points).toFixed(1)} / ${Number(x.weight).toFixed(0)}</div></div>`}).join("")}function histRows(h,kind){if(!h||!h.length)return'<tr><td colspan="8">Chưa đủ dữ liệu để lập bảng 3–5 năm.</td></tr>';return[...h].reverse().map(r=>`<tr><td><b>${r.year}</b></td><td>${money(r.revenue)}</td><td>${val(r.revenue_growth,"%")}</td><td>${money(r.npat)}</td><td>${val(r.profit_growth,"%")}</td><td>${val(r.roe,"%")}</td><td>${val(r.roa,"%")}</td><td>${kind==="regular"?val(r.de,"x"):"Không áp dụng"}</td></tr>`).join("")}function componentRows(c){return Object.values(c||{}).map(x=>`<tr><td>${esc(x.name)}</td><td>${val(x.value,x.unit)}</td><td>${Number(x.weight).toFixed(0)}</td><td>${x.points===null?"N/A":Number(x.points).toFixed(1)}</td><td>${esc(x.note||"")}</td></tr>`).join("")}
function sourceRows(rows){return(rows||[]).map(x=>`<tr><td><b>${esc(x.data)}</b></td><td>${esc(x.source)}</td><td>${esc(x.period)}</td><td>${esc(x.retrieved_at)}</td><td>${esc(x.note)}</td></tr>`).join("")||'<tr><td colspan="5">Chưa có bảng nguồn dữ liệu.</td></tr>'}function newsRows(rows){if(!rows||!rows.length)return'<div class="muted">Chưa lấy được tin doanh nghiệp từ nguồn hiện có.</div>';return rows.map(n=>{const href=String(n.url||"").startsWith("http")?`<a href="${esc(n.url)}" target="_blank" rel="noopener">Mở nguồn</a>`:"";return `<div class="news-item"><div class="news-title">${esc(n.title)}</div><div class="news-meta">${esc(n.publish_time||"N/A")} · ${esc(n.source||n.provider||"VNStock Reference")} ${href?"· "+href:""}</div>${n.summary?`<div class="muted tiny" style="margin-top:5px">${esc(n.summary).slice(0,300)}</div>`:""}</div>`}).join("")}
function render(){if(!D||!D.symbol){$("app").innerHTML='<div class="card empty"><h2>Hệ thống phân tích cơ hội đầu tư cổ phiếu</h2><p>Nhập mã như FPT, MWG hoặc VCB để xem tổng quan doanh nghiệp, tài chính, kỹ thuật, điểm 60/40, tin tức, kiểm thử nhiều mã và báo cáo PDF có bảng nguồn dữ liệu.</p></div>';return}$("symbolInput").value=D.symbol;$("chatTicker").textContent="· "+D.symbol;const f=D.fundamental,t=D.technical,s=D.score,sg=D.signal,c=f.criteria||{},g=f.groups||{},m=D.methodology||{},ci=D.company_info||{},ar=D.annual_report_source||{};$("app").innerHTML=`
<section class="hero" id="overview"><div class="card hero-main"><div class="ticker"><h1>${esc(D.symbol)}</h1><span class="company">${esc(D.company_name||"Doanh nghiệp niêm yết")}</span><span class="pill">${esc(D.exchange||"N/A")}</span><span class="pill">${esc(D.industry||f.company_type_label||"")}</span><span class="pill">${esc(f.company_type_label||"")}</span></div><div class="price">${money(t.close)} <span class="${tone(t.change_pct)}" style="font-size:14px">${num(t.change_pct)===null?"":(t.change_pct>0?"+":"")+Number(t.change_pct).toFixed(2)+"%"}</span></div><div class="muted tiny">Giá gần nhất: ${esc(t.date||"N/A")} · Nguồn giá: ${esc(D.price_source||"N/A")} · Kỳ BCTC: ${esc(f.latest_period||"N/A")} · Cập nhật: ${esc(D.updated_at||"")}</div><div class="section-nav"><a href="#company">Doanh nghiệp</a><a href="#fundamental">Tài chính</a><a href="#technical">Kỹ thuật</a><a href="#news">Tin tức</a><a href="#score">Điểm</a><a href="#validation">Kiểm thử nhiều mã</a><a href="#sources">Nguồn dữ liệu</a></div><p class="assessment">${esc(D.assessment)}</p><div class="actions"><a class="btn primary" href="/report/${encodeURIComponent(D.symbol)}.pdf">Xuất báo cáo PDF</a><a class="btn" href="#score">Xem cách tính điểm</a></div></div><div class="card score-card"><div class="muted">Tín hiệu đầu tư</div><div class="signal ${signalClass(sg.code)}">${esc(sg.label)}</div><div class="score-num ${scoreTone(s.score)}">${s.score===null?"N/A":Number(s.score).toFixed(1)}<span style="font-size:18px">/100</span></div><div class="muted">Mức rủi ro: <b>${esc(D.risk_level)}</b></div><div class="score-pair"><div class="mini-score"><span class="muted tiny">Cơ bản · 60%</span><strong>${s.fundamental.score===null?"N/A":Number(s.fundamental.score).toFixed(0)}</strong><div class="bar"><i style="width:${Math.max(0,Math.min(100,num(s.fundamental.score)||0))}%"></i></div></div><div class="mini-score"><span class="muted tiny">Kỹ thuật · 40%</span><strong>${s.technical.score===null?"N/A":Number(s.technical.score).toFixed(0)}</strong><div class="bar"><i style="width:${Math.max(0,Math.min(100,num(s.technical.score)||0))}%"></i></div></div></div><div style="margin-top:13px" class="tiny muted">Độ phủ dữ liệu: ${Number(s.coverage_pct).toFixed(1)}%</div><div class="bar"><i style="width:${Math.min(100,Number(s.coverage_pct))}%"></i></div><div class="comment" style="margin-top:13px">${esc(sg.reason)}</div></div></section>
<div class="grid">
<section class="card section span12" id="company"><h2>1. Thông tin doanh nghiệp</h2><div class="profile-grid"><div class="profile-item"><small>Tên đầy đủ</small><b>${esc(ci.company_name||D.company_name||"N/A")}</b></div><div class="profile-item"><small>Ngành</small><b>${esc(ci.industry||D.industry||"N/A")}</b></div><div class="profile-item"><small>Ngày niêm yết</small><b>${esc(ci.listing_date||"N/A")}</b></div><div class="profile-item"><small>Vốn hóa ước tính</small><b>${ci.market_cap?money(ci.market_cap)+" VND":"N/A"}</b></div><div class="profile-item"><small>Cổ phiếu lưu hành</small><b>${ci.issued_share?money(ci.issued_share):"N/A"}</b></div><div class="profile-item"><small>Sàn</small><b>${esc(ci.exchange||D.exchange||"N/A")}</b></div><div class="profile-item"><small>Website</small><b>${esc(ci.website||"N/A")}</b></div><div class="profile-item"><small>Nguồn hồ sơ</small><b>${esc(ci.source||"VNStock Reference")}</b></div></div>${ci.profile?`<h3>Mô tả hoạt động</h3><div class="comment">${esc(ci.profile)}</div>`:""}<div class="notice" style="margin-top:12px"><b>Phân loại chấm điểm:</b> ${esc(f.company_type_label)}. ${esc(m.industry_rule||"")}</div></section>
<section class="card section span12" id="fundamental"><h2>2. Phân tích tài chính cơ bản</h2><p class="muted tiny">Tách thành tăng trưởng, khả năng sinh lời & đòn bẩy và định giá. Doanh nghiệp tài chính không bị áp D/E như doanh nghiệp phi tài chính.</p><h3>Tăng trưởng</h3><div class="metrics">${groupMetrics(g.growth||[],c)}</div>${comments((f.comments||{}).growth)}<h3>Khả năng sinh lời và đòn bẩy</h3><div class="metrics">${groupMetrics(g.profitability_leverage||[],c)}</div>${comments((f.comments||{}).profitability_leverage)}<h3>Định giá</h3><div class="metrics">${groupMetrics(g.valuation||[],c)}</div>${comments((f.comments||{}).valuation)}<h3>Xu hướng tài chính 3–5 năm</h3><div class="table-wrap"><table class="table"><thead><tr><th>Năm</th><th>Doanh thu/thu nhập</th><th>Tăng trưởng</th><th>LNST</th><th>Tăng trưởng LNST</th><th>ROE</th><th>ROA</th><th>D/E</th></tr></thead><tbody>${histRows(f.history,f.company_type)}</tbody></table></div></section>
<section class="card section span8" id="technical"><h2>3. Phân tích kỹ thuật</h2><div class="chart-wrap"><iframe src="/chart/${encodeURIComponent(D.symbol)}?p=6M" title="Biểu đồ ${esc(D.symbol)}"></iframe></div></section><section class="card section span4"><h2>Tín hiệu kỹ thuật</h2><div class="metrics" style="grid-template-columns:1fr 1fr"><div class="metric"><small>Xu hướng</small><strong>${esc(t.trend)}</strong></div><div class="metric"><small>RSI14</small><strong>${val(t.rsi14,"")}</strong></div><div class="metric"><small>MA20</small><strong>${money(t.ma20)}</strong></div><div class="metric"><small>MA50</small><strong>${money(t.ma50)}</strong></div><div class="metric"><small>Khối lượng</small><strong>${money(t.volume)}</strong></div><div class="metric"><small>KL / TB20</small><strong>${num(t.vol_ratio)===null?"—":Number(t.vol_ratio).toFixed(2)+"x"}</strong></div></div><h3>Vì sao?</h3>${comments(t.reasons)}</section>
<section class="card section span6" id="news"><h2>4. Tin tức doanh nghiệp</h2><p class="muted tiny">Tin tức dùng làm bối cảnh và kiểm chứng, chưa trực tiếp cộng/trừ vào điểm đầu tư.</p>${newsRows(D.news)}</section><section class="card section span6"><h2>Nguồn báo cáo thường niên bổ sung</h2><div class="profile-grid" style="grid-template-columns:1fr 1fr"><div class="profile-item"><small>Nguồn</small><b>vn-annual-report-miner</b></div><div class="profile-item"><small>Trạng thái</small><b class="${ar.used?'status-ok':'warn'}">${ar.used?'Đã dùng':'Tùy chọn / chưa dùng'}</b></div></div><div class="comment">${esc(ar.note||"Nguồn bổ sung chưa được kích hoạt.")}</div><p class="muted tiny">Hệ thống chỉ ghi nguồn này là “đã dùng” khi công cụ arminer thực sự được cài và truy vấn thành công.</p></section>
<section class="card section span12" id="score"><h2>5. Bảng điểm tổng hợp và giải thích tín hiệu</h2><div class="rule-grid"><div class="rule"><b>Điểm cơ bản F</b><span class="muted">${s.fundamental.score===null?"N/A":s.fundamental.score+"/100"} · trọng số cuối 60%</span></div><div class="rule"><b>Điểm kỹ thuật T</b><span class="muted">${s.technical.score===null?"N/A":s.technical.score+"/100"} · trọng số cuối 40%</span></div><div class="rule"><b>Điểm tổng hợp S</b><span class="muted">${esc(s.formula)} = ${s.score===null?"N/A":s.score+"/100"}</span></div></div><h3>Chi tiết điểm cơ bản</h3><div class="table-wrap"><table class="table"><thead><tr><th>Chỉ tiêu</th><th>Giá trị</th><th>Điểm tối đa</th><th>Điểm đạt</th><th>Ghi chú</th></tr></thead><tbody>${componentRows(c)}</tbody></table></div><h3>Chi tiết điểm kỹ thuật</h3><div class="table-wrap"><table class="table"><thead><tr><th>Chỉ tiêu</th><th>Giá trị/diễn giải</th><th>Điểm tối đa</th><th>Điểm đạt</th></tr></thead><tbody>${Object.values(t.score_components||{}).map(x=>`<tr><td>${esc(x.name)}</td><td>${x.name.includes("RSI")?val(t.rsi14,""):x.name.includes("khối lượng")?(num(t.vol_ratio)===null?"—":Number(t.vol_ratio).toFixed(2)+"x"):esc(t.trend)}</td><td>${Number(x.weight).toFixed(0)}</td><td>${x.points===null?"N/A":Number(x.points).toFixed(1)}</td></tr>`).join("")}</tbody></table></div><h3>Kết hợp cơ bản và kỹ thuật</h3><div class="notice"><b>${esc(sg.label)}</b> — ${esc(sg.reason)}<br><span class="tiny">BUY chỉ xuất hiện khi điểm đủ cao, kỹ thuật xác nhận và không có cảnh báo nghiêm trọng. Thiếu dữ liệu quan trọng sẽ không tự động gán tín hiệu.</span></div></section>
<section class="card section span12"><h2>6. Luận điểm đầu tư và rủi ro</h2><div class="lists">${list("Luận điểm / điểm mạnh",D.strengths,"up")}${list("Điểm yếu / cần theo dõi",D.weaknesses,"warn")}${list("Rủi ro",D.risks,"down")}</div>${D.missing_data&&D.missing_data.length?`<div class="notice" style="margin-top:12px"><b>Dữ liệu thiếu:</b> ${esc(D.missing_data.join(", "))}</div>`:""}</section>
<section class="card section span12" id="backtest"><h2>7. Backtest một mã</h2><p class="muted tiny">Tín hiệu cuối phiên, giao dịch ở phiên kế tiếp; dữ liệu tài chính bị giới hạn theo kỳ giả định đã công bố để giảm look-ahead bias.</p><div class="actions"><button class="btn primary" id="backtestBtn">Chạy 3 năm</button><button class="btn small" data-y="1">1 năm</button><button class="btn small" data-y="5">5 năm</button></div><div id="backtestResult" class="backtest-box" style="margin-top:12px"><span class="muted">Chưa chạy backtest.</span></div></section>
<section class="card section span12" id="validation"><h2>8. Bảng kiểm thử nhiều mã</h2><p class="muted tiny">Chạy cùng một engine trên nhóm doanh nghiệp phi tài chính, ngân hàng, chứng khoán và bảo hiểm để kiểm tra tính nhất quán của phân loại và chấm điểm.</p><div class="actions"><button class="btn primary" id="validateBtn">Kiểm thử FPT, MWG, HPG, VCB, MBB, SSI, BVH</button></div><div id="validationResult" class="backtest-box" style="margin-top:12px"><span class="muted">Chưa chạy kiểm thử nhiều mã.</span></div></section>
<section class="card section span12" id="sources"><h2>9. Bảng nguồn dữ liệu và khả năng kiểm chứng</h2><div class="table-wrap"><table class="table"><thead><tr><th>Dữ liệu</th><th>Nguồn</th><th>Kỳ / ngày dữ liệu</th><th>Ngày lấy</th><th>Ghi chú</th></tr></thead><tbody>${sourceRows(D.data_sources)}</tbody></table></div></section>
<section class="card section span12" id="method"><h2>10. Phương pháp và giới hạn</h2><ul class="method-list"><li>${esc(m.formula||"")}. BUY: ${esc(m.buy_rule||"")}</li><li>HOLD: ${esc(m.hold_rule||"")}</li><li>SELL: ${esc(m.sell_rule||"")}</li><li>${esc(m.missing_rule||"")}</li><li>${esc(m.industry_rule||"")}</li><li>${esc(m.disclaimer||"")}</li></ul><div class="notice" style="margin-top:12px">${esc(D.disclaimer||"")}</div></section>
</div>`;setupBacktest();setupValidation()}
render();
function setupBacktest(){if(!D||!D.symbol)return;const btn=$("backtestBtn");if(btn)btn.onclick=()=>runBacktest(3);document.querySelectorAll("[data-y]").forEach(b=>b.onclick=()=>runBacktest(Number(b.dataset.y)))}async function runBacktest(years){const box=$("backtestResult");box.innerHTML='<span class="muted">Đang chạy backtest...</span>';try{const r=await fetch(`/api/backtest/${encodeURIComponent(D.symbol)}?years=${years}`);const j=await r.json();if(!r.ok)throw new Error(j.message||j.error||"Backtest lỗi");box.innerHTML=`<div class="bt-metrics"><div><span class="muted tiny">Lợi suất chiến lược</span><b class="${tone(j.strategy_return_pct)}">${val(j.strategy_return_pct,"%")}</b></div><div><span class="muted tiny">Buy & Hold</span><b class="${tone(j.buy_hold_return_pct)}">${val(j.buy_hold_return_pct,"%")}</b></div><div><span class="muted tiny">Max Drawdown</span><b>${val(j.max_drawdown_pct,"%")}</b></div><div><span class="muted tiny">Số GD / Win rate</span><b>${j.trades} / ${j.win_rate_pct===null?"N/A":j.win_rate_pct.toFixed(1)+"%"}</b></div></div><div class="comment" style="margin-top:10px">${esc(j.method_note)}</div><div class="muted tiny">${esc(j.limitation)}</div>`}catch(e){box.innerHTML=`<span class="down">${esc(e.message||"Không chạy được backtest.")}</span>`}}
function setupValidation(){const b=$("validateBtn");if(b)b.onclick=runValidation}async function runValidation(){const box=$("validationResult");box.innerHTML='<span class="muted">Đang kiểm thử nhiều mã; thao tác có thể mất một lúc do giới hạn nguồn dữ liệu...</span>';try{const syms="FPT,MWG,HPG,VCB,MBB,SSI,BVH";const r=await fetch(`/api/validate?symbols=${encodeURIComponent(syms)}`);const j=await r.json();if(!r.ok)throw new Error(j.message||j.error||"Lỗi kiểm thử");const rows=(j.rows||[]).map(x=>x.status==="OK"?`<tr><td><b>${esc(x.symbol)}</b></td><td>${esc(x.company_type)}</td><td>${x.fundamental_score??"N/A"}</td><td>${x.technical_score??"N/A"}</td><td>${x.total_score??"N/A"}</td><td>${x.coverage_pct??"N/A"}%</td><td>${esc(x.signal)}</td><td>${esc(x.risk)}</td><td>${esc(x.latest_price_date||"")} / ${esc(x.latest_financial_period||"")}</td></tr>`:`<tr><td><b>${esc(x.symbol)}</b></td><td colspan="8" class="down">${esc(x.error||"ERROR")}</td></tr>`).join("");box.innerHTML=`<div class="table-wrap"><table class="table"><thead><tr><th>Mã</th><th>Nhóm</th><th>F</th><th>T</th><th>S</th><th>Độ phủ</th><th>Tín hiệu</th><th>Rủi ro</th><th>Ngày giá / kỳ BCTC</th></tr></thead><tbody>${rows}</tbody></table></div>`}catch(e){box.innerHTML=`<span class="down">${esc(e.message||"Không chạy được kiểm thử.")}</span>`}}
$("chatToggle").onclick=()=>$("chatPanel").classList.toggle("open");async function sendChat(){if(!D||!D.symbol)return;const q=$("chatInput").value.trim();if(!q)return;const body=$("chatBody");body.insertAdjacentHTML("beforeend",`<div class="msg user">${esc(q)}</div>`);$("chatInput").value="";const wait=document.createElement("div");wait.className="msg bot";wait.textContent="Đang phân tích...";body.appendChild(wait);body.scrollTop=body.scrollHeight;try{const r=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({symbol:D.symbol,question:q})});const j=await r.json();wait.textContent=j.answer||j.error||"Không có phản hồi."}catch(e){wait.textContent="Không kết nối được chatbot."}body.scrollTop=body.scrollHeight}$("chatSend").onclick=sendChat;$("chatInput").addEventListener("keydown",e=>{if(e.key==="Enter")sendChat()});
</script></body></html>
